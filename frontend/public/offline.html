<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Retail IQ</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fdf6f3; color: #2b2b2b; padding: 24px;
    }
    .card {
      max-width: 420px; text-align: center; background: #fff; border: 1px solid #f3e6df;
      border-radius: 20px; padding: 40px 32px; box-shadow: 0 10px 40px rgba(0,0,0,.06);
    }
    .logo {
      width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
      background: linear-gradient(160deg, #f4725f, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 30px; font-weight: 800;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #6b6b6b; line-height: 1.5; margin: 0 0 24px; font-size: 15px; }
    button {
      border: 0; cursor: pointer; padding: 12px 22px; border-radius: 12px; font-weight: 600;
      color: #fff; background: linear-gradient(160deg, #f4725f, #7c3aed);
      box-shadow: 0 6px 18px rgba(124,58,237,.25); font-size: 15px;
    }
    .hint { margin-top: 18px; font-size: 12px; color: #9a9a9a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">R</div>
    <h1>You're offline</h1>
    <p>Retail IQ needs a connection for live sales data. Your dashboard will be back the moment you're reconnected.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">Cached shell · reconnect to resume live streaming</div>
  </div>
</body>
</html>
