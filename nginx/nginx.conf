# =============================================================================
# Nginx Configuration for Retail IQ
# Production-ready reverse proxy with SSL, caching, and security headers
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-font-ttf
               font/opentype image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream resolution — deliberately NOT `upstream` blocks.
    #
    # OSS nginx resolves a name inside an `upstream` block ONCE at startup and
    # caches the address forever. Docker gives a recreated container a NEW IP,
    # so nginx kept proxying to an address nothing was listening on: every
    # request 502'd until someone restarted nginx. That is a total outage on
    # every backend redeploy, and it looks healthy from the outside — all
    # containers up, API fine when hit directly, only nginx wrong.
    # Reproduced by scripts/test-nginx-reresolve.sh (IP .7 -> .10, all 502).
    #
    # 127.0.0.11 is Docker's embedded DNS. `valid=10s` re-resolves on that
    # cadence, so a redeploy self-heals within ~10 seconds untouched.
    # ipv6=off because these services bind IPv4 and a AAAA lookup only adds
    # latency and failure modes.
    #
    # TRADE-OFF, ACCEPTED KNOWINGLY: a variable proxy_pass cannot use an
    # `upstream` block, so we lose `keepalive 32` to the upstreams — every
    # proxied request opens a fresh connection. That costs some latency under
    # load. Correctness wins: a stale IP is a 100% outage, keepalive is a
    # throughput optimisation. Revisit with NGINX Plus (`resolve` on the server
    # directive keeps both) or a service mesh.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name _;
        
        # Allow health checks on HTTP
        location /health {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $host;
        }

        # ACME HTTP-01 challenge (certbot webroot mode). Must stay reachable over
        # plain HTTP, BEFORE the HTTPS redirect. The webroot is the read-only
        # ./nginx/certbot-www bind mount — see docs/runbooks/TLS_CERTS.md.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Connection limits
        limit_conn conn_limit 20;

        # Client body size limit
        client_max_body_size 10M;

        # =================================================================
        # API Routes (Backend)
        # =================================================================
        
        location /api/ {
            # Rate limiting for API
            limit_req zone=api_limit burst=20 nodelay;
            
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Stricter rate limiting for auth endpoints
        location /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE Streaming endpoint
        location /stream/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            
            # SSE specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            
            chunked_transfer_encoding off;
        }

        # Health check endpoint (no rate limiting)
        location /health {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $host;
        }

        # Monitoring endpoints (restrict access in production)
        location /api/monitoring/ {
            # Optionally restrict to internal IPs
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # allow 192.168.0.0/16;
            # deny all;
            
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =================================================================
        # Frontend (Next.js)
        # =================================================================
        
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream$request_uri;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Caching for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream$request_uri;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # =================================================================
        # Error pages
        # =================================================================
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
