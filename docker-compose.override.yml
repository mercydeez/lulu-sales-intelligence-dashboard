# Development overrides — merged automatically by `docker compose up`.
# (Production uses docker-compose.production.yml explicitly and is unaffected.)
#
# Backend: the base compose already mounts ./backend/app into the container,
# but the image's CMD runs uvicorn without --reload, so edits were invisible
# until a full rebuild. This override enables live reload.
#
# Frontend: the production image serves a pre-built standalone bundle, so the
# ./frontend/src mount has no effect. Tried running `next dev` in-container for
# hot reload, but on-demand page compilation over a Windows bind mount took 70s+
# per route on first visit — unusable for a demo. For frontend development run
# the dev server on the host against the containerized backend:
#   cd frontend && npm install --legacy-peer-deps && npm run dev
# The container always serves the fast prebuilt bundle (`docker compose up -d --build`
# after any frontend change) for demo-stable performance.

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # DEV/DEMO rate limit. The limiter buckets per client IP, but in Docker
      # every browser request arrives from the single gateway IP, so one active
      # dashboard session (live SSE + multi-panel fetches + a stream ticket on
      # every tab switch) blows past the 100/min prod default — and then even
      # /api/auth/login gets 429'd ("Login failed"). Raise it well clear of one
      # busy user for local demos. Production (docker-compose.production.yml)
      # keeps the stricter default and is unaffected.
      RATE_LIMIT_REQUESTS: "6000"
      RATE_LIMIT_WINDOW: "60"
