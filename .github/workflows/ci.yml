name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # =========================================================================
  # Backend — Lint + Test
  # =========================================================================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc
        working-directory: .

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: python -c "from app.config import Settings; print('Import OK:', Settings.__name__)"

      - name: Run tests
        env:
          ENVIRONMENT: testing
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          SECRET_KEY: ci-test-app-secret-key-minimum-32-characters
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/1
        run: pytest tests/ --tb=long

  # =========================================================================
  # Frontend — Lint + Build
  # =========================================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit --pretty

      - name: Component tests (Vitest + RTL)
        run: npm test

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SSE_URL: http://localhost:8000/stream/sales
        run: npm run build

  # =========================================================================
  # Docker — Validate compose file builds
  # =========================================================================
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate dev docker-compose
        run: docker compose config -q

      - name: Validate production docker-compose
        env:
          POSTGRES_PASSWORD: ci-dummy-pg-pass
          REDIS_PASSWORD: ci-dummy-redis-pass
          WORKER_DB_PASSWORD: ci-dummy-worker-pass
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          SECRET_KEY: ci-test-app-secret-key-minimum-32-characters
          CORS_ORIGINS: https://example.com
          NEXT_PUBLIC_API_URL: https://example.com
        run: docker compose -f docker-compose.production.yml config -q

      - name: Backup/restore scripts parse (bash -n)
        run: |
          for s in scripts/backup-postgres.sh scripts/restore-postgres.sh scripts/verify-backup.sh \
                   scripts/drill-restore.sh scripts/backup-scheduler.sh; do
            echo "checking $s"; bash -n "$s"
          done
          # The scheduler must also run under POSIX sh (busybox in the sidecar).
          sh -n scripts/backup-scheduler.sh

      - name: Build backend image
        run: docker build -t app-backend-test ./backend

      - name: Build frontend image
        run: docker build -t app-frontend-test ./frontend

      - name: Build diagnostics worker image
        run: docker build -t app-worker-test ./worker

      - name: Worker unit tests (outcome classification)
        run: docker run --rm app-worker-test npm test

  # =========================================================================
  # Smoke — boot the full stack and assert the API actually responds
  # =========================================================================
  smoke:
    name: Stack Smoke Test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Boot the stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ~$((i*5))s"; exit 0; fi
            echo "attempt $i: http=$code"; sleep 5
          done
          echo "backend never became healthy"; docker compose logs backend | tail -50; exit 1

      - name: Assert /health reports all subsystems healthy
        run: |
          curl -s http://localhost:8000/health | tee /tmp/health.json
          grep -q '"database":"healthy"' /tmp/health.json
          grep -q '"redis":"healthy"' /tmp/health.json

      # E0-2: uptime monitoring. /health/deep must expose worker_heartbeat, and the
      # running worker service must emit a FRESH heartbeat within a bounded wait.
      - name: E0-2 — /health/deep exposes worker_heartbeat + becomes fresh
        run: |
          curl -fsS http://localhost:8000/health/deep | tee /tmp/deep.json
          grep -q 'worker_heartbeat' /tmp/deep.json
          grep -q '"backup"' /tmp/deep.json
          grep -q '"alerting"' /tmp/deep.json
          # Wait (bounded) for the worker's heartbeat to be reported ok.
          for i in $(seq 1 18); do
            hb=$(curl -s http://localhost:8000/health/deep | python3 -c "import sys,json;print(json.load(sys.stdin)['checks']['worker_heartbeat']['status'])" 2>/dev/null || echo "unknown")
            echo "attempt $i: worker_heartbeat=$hb"
            if [ "$hb" = "ok" ]; then echo "worker heartbeat fresh"; exit 0; fi
            sleep 5
          done
          echo "worker heartbeat never became fresh"; docker compose logs worker | tail -50; exit 1

      - name: E0-2 — /health/ready returns 200 on the full stack
        run: |
          code=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8000/health/ready)
          cat /tmp/ready.json; echo
          test "$code" = "200"

      - name: Set up Python for golden tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run golden-number + Sage integration tests against the live stack
        env:
          SMOKE_API_URL: http://localhost:8000
          # Sage's least-privilege role, reachable on the runner's published port.
          SAGE_DATABASE_URL: postgresql+asyncpg://sage_ro:sage_ro_dev_pass@localhost:5432/salesdb
        run: |
          pip install pytest pytest-asyncio asyncpg sqlalchemy
          # Integration suites (need the live stack). Static guards run in the backend job.
          pytest backend/tests/test_golden_numbers.py backend/tests/test_nl2sql_pipeline.py -v --tb=short

      - name: Diagnostics worker runs a scan without error
        run: docker compose run --rm worker npm run scan:once

      - name: Diagnostics worker runs a measure pass without error
        run: docker compose run --rm worker npm run measure:once

      # E6-1: prove the canonical metric_* views are value-preserving + tenant-safe
      # against the live seeded DB. Runs in-container where DATABASE_URL already
      # points at the seeded Postgres; RUN_DB_TESTS=1 un-skips the live-DB guards.
      - name: Metric-view parity + tenant safety (E6-1)
        run: docker compose exec -T -e RUN_DB_TESTS=1 backend python -m pytest tests/test_metric_views_parity.py -v --tb=short

      # E7-4: root-cause decomposition — value-correctness + tenant isolation
      # against the live seeded DB (pure-logic tests already run in the backend job).
      - name: Root-cause decomposition (E7-4)
        run: docker compose exec -T -e RUN_DB_TESTS=1 backend python -m pytest tests/test_root_cause.py -v --tb=short

      - name: Tear down
        if: always()
        run: docker compose down -v

  # =========================================================================
  # Migrations — fresh DB apply + idempotent re-apply on an existing DB
  # =========================================================================
  migrations:
    name: Migrations (fresh + existing DB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Boot Postgres (init.sql runs on the fresh volume)
        run: docker compose up -d postgres

      - name: Wait for Postgres healthy
        run: |
          for i in $(seq 1 40); do
            if docker compose exec -T postgres pg_isready -U salesuser -d salesdb >/dev/null 2>&1; then
              echo "postgres ready after ~$((i*3))s"; exit 0; fi
            echo "waiting ($i)"; sleep 3
          done
          echo "postgres never became ready"; docker compose logs postgres | tail -40; exit 1

      - name: Build backend image (for the migrate one-shot)
        run: docker compose build backend

      - name: Apply migrations on a FRESH DB
        run: docker compose run --rm -e RUN_MIGRATIONS_ON_STARTUP=false backend python -m app.commands.migrate

      - name: Re-apply on the EXISTING DB (must be an idempotent no-op, exit 0)
        run: docker compose run --rm -e RUN_MIGRATIONS_ON_STARTUP=false backend python -m app.commands.migrate

      - name: Assert every on-disk migration is registered
        run: |
          on_disk=$(ls database/migrations/*.sql | wc -l | tr -d ' ')
          applied=$(docker compose exec -T postgres psql -U salesuser -d salesdb -tAc "SELECT count(*) FROM schema_migrations;" | tr -d ' ')
          echo "on_disk=$on_disk applied=$applied"
          test "$applied" -ge "$on_disk"

      # E6-2: the committed Alembic baseline must match the schema the canonical
      # path (init.sql + numbered migrations) actually produces. If a prior
      # migration was edited, or a new one landed without regenerating the
      # baseline, the normalized dumps differ and this fails.
      - name: Schema drift guard (baseline is current)
        run: |
          docker compose exec -T postgres pg_dump -U salesuser -d salesdb \
            --schema-only --no-owner --no-privileges \
            | grep -vE '^--' | grep -vE '^\\(un)?restrict ' | cat -s > /tmp/live_schema.sql
          if ! diff -u database/baseline/schema_baseline.sql /tmp/live_schema.sql; then
            echo "::error::Schema baseline is stale. Run ./scripts/regenerate-schema-baseline.sh and commit."
            exit 1
          fi
          echo "Baseline matches the canonical schema."

      # E6-2: `alembic upgrade head` on an EMPTY database must reproduce that same
      # schema (proves the squash baseline is a valid entry point, not just a file).
      - name: Alembic upgrade head reproduces the schema
        run: |
          docker compose exec -T postgres psql -U salesuser -d postgres -c "CREATE DATABASE alembic_ci;"
          docker compose run --rm --user root \
            -e DATABASE_URL="postgresql+asyncpg://salesuser:salespass@postgres:5432/alembic_ci" \
            backend bash -lc "cd /app && python -m alembic upgrade head && python -m alembic current | grep -q '0001_baseline (head)'"
          # Functional parity: same table/view/function/trigger/policy counts as the
          # canonical DB, allowing +1 table/index for alembic_version bookkeeping.
          canon=$(docker compose exec -T postgres psql -U salesuser -d salesdb -tAc "SELECT (SELECT count(*) FROM information_schema.views WHERE table_schema='public')||'/'||(SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid WHERE n.nspname='public')||'/'||(SELECT count(*) FROM pg_policy);")
          built=$(docker compose exec -T postgres psql -U salesuser -d alembic_ci -tAc "SELECT (SELECT count(*) FROM information_schema.views WHERE table_schema='public')||'/'||(SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid WHERE n.nspname='public')||'/'||(SELECT count(*) FROM pg_policy);")
          echo "views/functions/policies — canonical=$canon alembic=$built"
          test "$canon" = "$built"

      - name: Tear down
        if: always()
        run: docker compose down -v

  # =========================================================================
  # Backup / restore drill (blueprint E0-1) — proves the DR path on every push.
  # Takes a real pg_dump, verifies it, restores into a scratch DB, and asserts
  # every table's row count + a content checksum match. This is the automated
  # "rehearsed restore" the audit flagged as missing.
  # =========================================================================
  backup-restore-drill:
    name: Backup/Restore Drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: salesuser
          POSTGRES_PASSWORD: salespass
          POSTGRES_DB: salesdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salesuser -d salesdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run the restore drill (self-seeded probe data, exact-version pg tools)
        # Use postgres:15-alpine so pg_dump/pg_restore exactly match the server.
        # --network host lets the container reach the `postgres` service on localhost.
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            -e PGHOST=localhost -e PGPORT=5432 -e PGUSER=salesuser -e PGPASSWORD=salespass \
            -e SOURCE_DB=salesdb -e SCRATCH_DB=retailiq_drill -e MAINT_DB=postgres \
            -e DRILL_SELF_SEED=1 -e BACKUP_DIR=/tmp/backups -e RTO_BUDGET_SECONDS=600 \
            -v "$PWD/scripts:/scripts:ro" \
            postgres:15-alpine /scripts/drill-restore.sh

  # =========================================================================
  # Security — dependency + image vulnerability scanning (supply chain, A06)
  # =========================================================================
  security-scan:
    name: Dependency & Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Full advisory report (informational). pip-audit has no severity filter, so
      # the BLOCKING gate is the severity-aware Trivy fs scan below — this step
      # stays advisory rather than failing on every low-severity transitive note.
      - name: Python dependency audit (pip-audit, advisory report)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc || echo "::warning::pip-audit found advisories — review above"

      # BLOCKING: any critical advisory in the frontend tree fails the build.
      - name: Node dependency audit (npm) — blocking on critical
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Build backend image for scanning
        run: docker build -t scan/backend:ci ./backend

      - name: Trivy image scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan/backend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"   # BLOCKING: fail the build on fixable HIGH/CRITICAL CVEs
          ignore-unfixed: true

      - name: Trivy filesystem scan (IaC + manifests)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      # E5-5 BLOCKING dependency gate: fail on a CRITICAL vulnerability that has a
      # fix available. Deliberate exceptions live in .trivyignore, each with a
      # rationale, an owner and a follow-up — never a blanket silence.
      - name: Trivy dependency scan — BLOCKING on fixable CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      # E5-5 SBOM: one per release artifact. Source SBOM covers requirements.txt +
      # frontend/package-lock.json; the image SBOM additionally covers the OS layer
      # (and the worker's unlocked npm deps once it is imaged).
      - name: SBOM — source tree (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-source.cdx.json

      - name: SBOM — backend image (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: scan/backend:ci
          format: cyclonedx-json
          artifact-name: sbom-backend-image.cdx.json

  # =========================================================================
  # Secrets scan (E5-5) — gitleaks over the FULL git history on every push.
  # A secret committed and later deleted is still leaked, so a working-tree-only
  # scan would miss it; fetch-depth: 0 gets the whole history.
  # Allowlist: .gitleaks.toml — narrow, per-finding, never whole directories.
  # Run locally exactly as CI does (see the header of .gitleaks.toml).
  # =========================================================================
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The pinned official image keeps CI and local runs byte-identical and
      # sidesteps gitleaks-action's org-license requirement.
      - name: gitleaks detect (BLOCKING)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  # =========================================================================
  # Deploy config (E0-3/E0-4) — validate scripts, production compose, workflows.
  # No deploy secrets required; runs on every push/PR.
  # =========================================================================
  deploy-config:
    name: Deploy Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Shell syntax check deploy scripts
        run: |
          bash -n scripts/validate-production-compose.sh
          bash -n scripts/deploy-compose.sh
          bash -n scripts/smoke-deploy.sh

      - name: Generate self-signed TLS material (staging/smoke only — D2 blocker check needs the files present)
        run: bash scripts/gen-self-signed-ssl.sh ci.example.com

      - name: Validate production compose (no demo/seed; E0-2 wired; /health/ready)
        env:
          NEXT_PUBLIC_API_URL: https://example.com
        run: bash scripts/validate-production-compose.sh

      - name: deploy-compose.sh dry-run
        run: DRY_RUN=true bash scripts/deploy-compose.sh

      - name: Parse all workflow YAML
        run: |
          python3 - <<'PY'
          import pathlib, yaml
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(p.read_text()); print("ok", p)
          PY
