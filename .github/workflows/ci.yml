name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # =========================================================================
  # Backend — Lint + Test
  # =========================================================================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc
        working-directory: .

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: python -c "from app.config import Settings; print('Import OK:', Settings.__name__)"

      - name: Run tests
        env:
          ENVIRONMENT: testing
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          SECRET_KEY: ci-test-app-secret-key-minimum-32-characters
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/1
        run: pytest tests/ --tb=long

  # =========================================================================
  # Frontend — Lint + Build
  # =========================================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit --pretty

      - name: Component tests (Vitest + RTL)
        run: npm test

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SSE_URL: http://localhost:8000/stream/sales
        run: npm run build

  # =========================================================================
  # Docker — Validate compose file builds
  # =========================================================================
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate dev docker-compose
        run: docker compose config -q

      - name: Validate production docker-compose
        env:
          POSTGRES_PASSWORD: ci-dummy-pg-pass
          REDIS_PASSWORD: ci-dummy-redis-pass
          WORKER_DB_PASSWORD: ci-dummy-worker-pass
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          SECRET_KEY: ci-test-app-secret-key-minimum-32-characters
          CORS_ORIGINS: https://example.com
        run: docker compose -f docker-compose.production.yml config -q

      - name: Backup/restore scripts parse (bash -n)
        run: |
          for s in scripts/backup-postgres.sh scripts/restore-postgres.sh scripts/verify-backup.sh; do
            echo "checking $s"; bash -n "$s"
          done

      - name: Build backend image
        run: docker build -t app-backend-test ./backend

      - name: Build frontend image
        run: docker build -t app-frontend-test ./frontend

      - name: Build diagnostics worker image
        run: docker build -t app-worker-test ./worker

      - name: Worker unit tests (outcome classification)
        run: docker run --rm app-worker-test npm test

  # =========================================================================
  # Smoke — boot the full stack and assert the API actually responds
  # =========================================================================
  smoke:
    name: Stack Smoke Test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Boot the stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ~$((i*5))s"; exit 0; fi
            echo "attempt $i: http=$code"; sleep 5
          done
          echo "backend never became healthy"; docker compose logs backend | tail -50; exit 1

      - name: Assert /health reports all subsystems healthy
        run: |
          curl -s http://localhost:8000/health | tee /tmp/health.json
          grep -q '"database":"healthy"' /tmp/health.json
          grep -q '"redis":"healthy"' /tmp/health.json

      - name: Set up Python for golden tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run golden-number + Sage integration tests against the live stack
        env:
          SMOKE_API_URL: http://localhost:8000
          # Sage's least-privilege role, reachable on the runner's published port.
          SAGE_DATABASE_URL: postgresql+asyncpg://sage_ro:sage_ro_dev_pass@localhost:5432/salesdb
        run: |
          pip install pytest pytest-asyncio asyncpg sqlalchemy
          # Integration suites (need the live stack). Static guards run in the backend job.
          pytest backend/tests/test_golden_numbers.py backend/tests/test_nl2sql_pipeline.py -v --tb=short

      - name: Diagnostics worker runs a scan without error
        run: docker compose run --rm worker npm run scan:once

      - name: Diagnostics worker runs a measure pass without error
        run: docker compose run --rm worker npm run measure:once

      - name: Tear down
        if: always()
        run: docker compose down -v

  # =========================================================================
  # Migrations — fresh DB apply + idempotent re-apply on an existing DB
  # =========================================================================
  migrations:
    name: Migrations (fresh + existing DB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Boot Postgres (init.sql runs on the fresh volume)
        run: docker compose up -d postgres

      - name: Wait for Postgres healthy
        run: |
          for i in $(seq 1 40); do
            if docker compose exec -T postgres pg_isready -U salesuser -d salesdb >/dev/null 2>&1; then
              echo "postgres ready after ~$((i*3))s"; exit 0; fi
            echo "waiting ($i)"; sleep 3
          done
          echo "postgres never became ready"; docker compose logs postgres | tail -40; exit 1

      - name: Build backend image (for the migrate one-shot)
        run: docker compose build backend

      - name: Apply migrations on a FRESH DB
        run: docker compose run --rm -e RUN_MIGRATIONS_ON_STARTUP=false backend python -m app.commands.migrate

      - name: Re-apply on the EXISTING DB (must be an idempotent no-op, exit 0)
        run: docker compose run --rm -e RUN_MIGRATIONS_ON_STARTUP=false backend python -m app.commands.migrate

      - name: Assert every on-disk migration is registered
        run: |
          on_disk=$(ls database/migrations/*.sql | wc -l | tr -d ' ')
          applied=$(docker compose exec -T postgres psql -U salesuser -d salesdb -tAc "SELECT count(*) FROM schema_migrations;" | tr -d ' ')
          echo "on_disk=$on_disk applied=$applied"
          test "$applied" -ge "$on_disk"

      - name: Tear down
        if: always()
        run: docker compose down -v

  # =========================================================================
  # Security — dependency + image vulnerability scanning (supply chain, A06)
  # =========================================================================
  security-scan:
    name: Dependency & Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || echo "::warning::pip-audit found advisories — review above"

      - name: Node dependency audit (npm)
        working-directory: ./frontend
        run: npm audit --omit=dev || echo "::warning::npm audit found advisories — review above"

      - name: Build backend image for scanning
        run: docker build -t scan/backend:ci ./backend

      - name: Trivy image scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan/backend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"   # BLOCKING: fail the build on fixable HIGH/CRITICAL CVEs
          ignore-unfixed: true

      - name: Trivy filesystem scan (IaC + manifests)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
