name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # =========================================================================
  # Backend — Lint + Test
  # =========================================================================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc
        working-directory: .

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: python -c "from app.config import Settings; print('Import OK:', Settings.__name__)"

      - name: Run tests
        env:
          ENVIRONMENT: testing
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          SECRET_KEY: ci-test-app-secret-key-minimum-32-characters
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/1
        run: pytest tests/ --tb=long

  # =========================================================================
  # Frontend — Lint + Build
  # =========================================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit --pretty

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SSE_URL: http://localhost:8000/stream/sales
        run: npm run build

  # =========================================================================
  # Docker — Validate compose file builds
  # =========================================================================
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config -q

      - name: Build backend image
        run: docker build -t app-backend-test ./backend

      - name: Build frontend image
        run: docker build -t app-frontend-test ./frontend

  # =========================================================================
  # Smoke — boot the full stack and assert the API actually responds
  # =========================================================================
  smoke:
    name: Stack Smoke Test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Boot the stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ~$((i*5))s"; exit 0; fi
            echo "attempt $i: http=$code"; sleep 5
          done
          echo "backend never became healthy"; docker compose logs backend | tail -50; exit 1

      - name: Assert /health reports all subsystems healthy
        run: |
          curl -s http://localhost:8000/health | tee /tmp/health.json
          grep -q '"database":"healthy"' /tmp/health.json
          grep -q '"redis":"healthy"' /tmp/health.json

      - name: Set up Python for golden tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run golden-number + Sage integration tests against the live stack
        env:
          SMOKE_API_URL: http://localhost:8000
          # Sage's least-privilege role, reachable on the runner's published port.
          SAGE_DATABASE_URL: postgresql+asyncpg://sage_ro:sage_ro_dev_pass@localhost:5432/salesdb
        run: |
          pip install pytest pytest-asyncio asyncpg sqlalchemy
          # Integration suites (need the live stack). Static guards run in the backend job.
          pytest backend/tests/test_golden_numbers.py backend/tests/test_nl2sql_pipeline.py -v --tb=short

      - name: Tear down
        if: always()
        run: docker compose down -v
