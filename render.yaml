# Render Blueprint — Retail IQ (free tier)
#
# Deploy: push to GitHub, then in Render: New + > Blueprint > pick this repo.
# Render provisions everything below. Two values can't be known until the
# services exist, so they are `sync: false` (set them in the dashboard after the
# first deploy, then redeploy — see DEPLOY.md):
#   - frontend NEXT_PUBLIC_API_URL  -> the backend's https URL
#   - backend  CORS_ORIGINS / CSP_CONNECT_SRC -> the frontend's https URL
#
# Notes:
#   - Free web services SLEEP after ~15 min idle. The live data pipeline needs the
#     backend awake, so add a keep-warm pinger (DEPLOY.md) hitting /health.
#   - Free Postgres expires ~90 days after creation.
#   - First boot runs the seeder (loads 913k rows) — allow ~1-2 minutes.

databases:
  - name: app-postgres
    databaseName: salesdb
    user: salesuser
    plan: free

services:
  # ---- Redis (Key Value): pub/sub + response cache + rate-limit + JWT blacklist ----
  - type: redis
    name: app-redis
    plan: free
    ipAllowList: []            # internal only
    maxmemoryPolicy: allkeys-lru

  # ---- Backend (FastAPI, always-on for the generator + SSE) ----
  - type: web
    name: app-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_JSON
        value: "true"
      # This is a DEMO deploy: a single always-on box that seeds synthetic data
      # and runs the live generator. DEMO_MODE makes that explicit and permits
      # on-startup migrate/seed on this one box (see docs/production/ENVIRONMENT.md).
      - key: DEMO_MODE
        value: "true"
      # Demo logins stay OFF (the demo uses its own seeded accounts). Never
      # enable demo users on a real-tenant deploy.
      - key: ALLOW_DEMO_USERS
        value: "false"
      # Free-tier managed Postgres has no app_rw role wired, so RLS runs in
      # app-layer-only mode here. Acceptable for a single-tenant DEMO only — a
      # real multi-tenant deploy MUST set USE_RLS_ROLE=true + RLS_DATABASE_URL.
      - key: ALLOW_INSECURE_NO_RLS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: app-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: app-redis
          property: connectionString
      - key: JWT_SECRET_KEY      # strong secret generated by Render
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS        # set to the frontend URL after first deploy
        sync: false
      - key: CSP_CONNECT_SRC     # e.g. "'self' https://app-backend.onrender.com"
        sync: false
      - key: OPENAI_API_KEY      # optional; without it the AI uses the rule-based fallback
        sync: false

  # ---- Frontend (Next.js standalone) ----
  - type: web
    name: app-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Inlined at build (the Dockerfile declares a matching ARG). Set to the
      # backend's https URL, then trigger a redeploy so it bakes in.
      - key: NEXT_PUBLIC_API_URL
        sync: false
