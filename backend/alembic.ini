# Alembic configuration (E6-2). The database URL is NOT hardcoded here — env.py
# reads it from app settings (DATABASE_URL), so there is one source of truth and
# no secret in this file.
[alembic]
script_location = alembic
prepend_sys_path = .
# Revision ids are zero-padded ordinals (0001, 0002, …) for readable ordering.
# `alembic revision` will still generate hash ids unless --rev-id is passed; the
# team convention (see docs/production/MIGRATIONS.md) is to pass a padded ordinal.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
