services:
  postgres:
    image: pgvector/pgvector:pg15  # pgvector-enabled PG15 (semantic layer / RAG needs the `vector` type)
    # container_name is parameterized so parallel checkouts of this repo don't
    # collide on a fixed name (the failure you hit booting a second working dir).
    # Default keeps the canonical `sales_db` so existing docs/scripts still work;
    # set PROJECT_PREFIX (e.g. in a sibling dir's .env) to run stacks side by side.
    container_name: ${PROJECT_PREFIX:-sales}_db
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salespass}
      POSTGRES_DB: ${POSTGRES_DB:-salesdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema + data are seeded by the backend app (services/db_seeder.py) so the
      # exact same path works on managed Postgres (Render). No entrypoint init.sql.
    ports:
      # Bind to loopback only — reachable for local dev tooling, NOT from the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesuser} -d ${POSTGRES_DB:-salesdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales_network

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_PREFIX:-sales}_redis
    security_opt:
      - no-new-privileges:true
    # Require a password (holds the JWT blacklist, rate-limit counters, cache,
    # pub/sub) and persist with AOF. Override REDIS_PASSWORD in prod.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-sales_redis_dev_pass}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"   # loopback only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sales_redis_dev_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_PREFIX:-sales}_backend
    security_opt:
      - no-new-privileges:true
    # E6-5 follow-up: real multi-worker serving. gunicorn (not `uvicorn --workers`,
    # whose supervisor does NOT restart a dead worker) manages N UvicornWorkers,
    # with periodic recycling. --timeout 120 protects long-lived SSE streams. This
    # base command is overridden in docker-compose.override.yml with single-worker
    # `uvicorn --reload` for everyday hot-reload dev; it applies when you run the
    # base compose alone (load tests, CI, prod-like local).
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w ${WEB_CONCURRENCY:-4}
      -b 0.0.0.0:8000
      --timeout 120
      --graceful-timeout 30
      --max-requests 2000
      --max-requests-jitter 200
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-salesuser}:${POSTGRES_PASSWORD:-salespass}@postgres:5432/${POSTGRES_DB:-salesdb}
      # Defense-in-depth: the authenticated request path runs as the non-owner
      # app_rw role so Postgres FORCE RLS enforces tenant isolation at the DB
      # (migrations 020/026), with app-layer scoping still primary. ON by default
      # now that the request-path tenant GUC binding (resolve_request_tenant) and
      # owner-session API-key lookup are in place and two-tenant isolation is
      # verified. Set USE_RLS_ROLE=false to fall back to the owner connection.
      - USE_RLS_ROLE=${USE_RLS_ROLE:-true}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-sales_redis_dev_pass}@redis:6379
      - ENVIRONMENT=development
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-change-in-production-2026}
      # localhost:3001 = host `npm run dev` fallback port while the frontend
      # container holds 3000 (see CLAUDE.md: compose does not hot-reload).
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000,http://localhost:3001
      - MAX_BODY_SIZE_MB=10
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Opt-in gate for 3rd-party LLM calls — the key alone is not enough; the
      # provider chain also requires ENABLE_EXTERNAL_AI=true (see services/llm).
      - ENABLE_EXTERNAL_AI=${ENABLE_EXTERNAL_AI:-false}
      # Per-IP requests/min. Default 100 can trip on dashboard refresh bursts
      # (each page load fires many API calls + sidebar badges + experience).
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      # Sage NL->SQL / AI provider chain. Empty by default => Sage uses the
      # rule-based fallback (no key needed to run). To enable the local model:
      #   docker compose --profile ai up -d        # starts the ollama service
      #   docker exec sales_ollama ollama pull llama3.2
      #   set OLLAMA_URL=http://ollama:11434 (e.g. in .env) and restart backend
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      # Sage's least-privilege read role (migration 023). Defaults to deriving
      # sage_ro creds from DATABASE_URL; override in prod.
      - SAGE_DATABASE_URL=${SAGE_DATABASE_URL:-}
      # Sage v3 multi-agent graph (LangGraph): router → intent/clarity →
      # clarification/readback → executor → critic → cross-validate → arbiter →
      # completeness → finaliser, with confidence + agent trace surfaced to the UI.
      # ON for this demo; roll back instantly with USE_SAGE_V3=false (the proven
      # Sage v2 path then serves).
      - USE_SAGE_V3=${USE_SAGE_V3:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - ./database:/app/database:ro
    networks:
      - sales_network

  # E6-5 follow-up: the ONE home for continuous singletons (data generator, demo
  # reset, cache warmer, forecast trainer, partition maintenance). These used to
  # run inside the API lifespan — under `gunicorn --workers N` that would run N of
  # each. Here they run in exactly one container, so duplication is impossible by
  # construction rather than by a runtime election. `docker compose up -d` starts
  # it by default, so the dev demo still gets live sales. It uses the same image
  # and the same config defaults as the backend (DEMO_MODE etc. auto-on in dev).
  singletons:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_PREFIX:-sales}_singletons
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "app.commands.singletons"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-salesuser}:${POSTGRES_PASSWORD:-salespass}@postgres:5432/${POSTGRES_DB:-salesdb}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-sales_redis_dev_pass}@redis:6379
      - ENVIRONMENT=development
      - USE_RLS_ROLE=${USE_RLS_ROLE:-true}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - ./database:/app/database:ro
    networks:
      - sales_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${PROJECT_PREFIX:-sales}_frontend
    security_opt:
      - no-new-privileges:true
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SSE_URL=http://localhost:8000/stream/sales
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - sales_network

  # Diagnostics worker (A3): Node + BullMQ on the existing Redis. Runs deterministic
  # rules on a schedule and writes explainable `findings` rows the dashboard + Sage read.
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: ${PROJECT_PREFIX:-sales}_worker
    security_opt:
      - no-new-privileges:true
    environment:
      # Least-privilege role (migration 029): SELECT on sales/items/stores +
      # R/W on findings only — no access to users/credentials. Falls back to the
      # owner DATABASE_URL in worker/src/db.js if WORKER_DATABASE_URL is unset.
      - WORKER_DATABASE_URL=postgresql://worker_rw:${WORKER_DB_PASSWORD:-worker_rw_dev_pass}@postgres:5432/${POSTGRES_DB:-salesdb}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-salesuser}:${POSTGRES_PASSWORD:-salespass}@postgres:5432/${POSTGRES_DB:-salesdb}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-sales_redis_dev_pass}@redis:6379
      - DIAGNOSTICS_INTERVAL_MS=${DIAGNOSTICS_INTERVAL_MS:-300000}
      # Optional: any Slack/Discord/Teams incoming webhook. Empty => worker just logs.
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
      - NOTIFY_MIN_SEVERITY=${NOTIFY_MIN_SEVERITY:-high}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started   # ensure migrations (findings table) have run
    networks:
      - sales_network
    restart: unless-stopped

  # Automated backups (blueprint E0-1) — opt-in locally with `--profile backup`
  # so the default `docker compose up` stays lean. In production this runs by
  # default (docker-compose.production.yml). Exercise the whole path locally:
  #   docker compose --profile backup up backup          # nightly loop + on-start dump
  #   docker compose --profile backup run --rm backup \
  #     /bin/sh -c "SOURCE_DB=salesdb DRILL_SELF_SEED=0 sh /scripts/drill-restore.sh"
  backup:
    image: pgvector/pgvector:pg15  # pgvector-enabled PG15 (semantic layer / RAG needs the `vector` type)
    container_name: ${PROJECT_PREFIX:-sales}_backup
    profiles: ["backup"]
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-salesuser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-salespass}
      PGDATABASE: ${POSTGRES_DB:-salesdb}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-02:00}
      BACKUP_ON_START: ${BACKUP_ON_START:-1}
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec /bin/sh /scripts/backup-scheduler.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sales_network

  # Local LLM for Sage (and the AI assistant). Behind the "ai" profile so the
  # default `docker compose up` stays lean — start it with `--profile ai`.
  # No paid key: pull a model once with `docker exec sales_ollama ollama pull llama3.2`.
  ollama:
    image: ollama/ollama:latest
    container_name: ${PROJECT_PREFIX:-sales}_ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - sales_network

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  postgres_backups:

networks:
  sales_network:
    driver: bridge