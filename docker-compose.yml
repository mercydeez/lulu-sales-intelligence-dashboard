services:
  postgres:
    image: postgres:15-alpine
    container_name: sales_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salespass}
      POSTGRES_DB: ${POSTGRES_DB:-salesdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema + data are seeded by the backend app (services/db_seeder.py) so the
      # exact same path works on managed Postgres (Render). No entrypoint init.sql.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesuser} -d ${POSTGRES_DB:-salesdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales_network

  redis:
    image: redis:7-alpine
    container_name: sales_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-salesuser}:${POSTGRES_PASSWORD:-salespass}@postgres:5432/${POSTGRES_DB:-salesdb}
      # Defense-in-depth: set USE_RLS_ROLE=true to run the authenticated request
      # path as the non-owner app_rw role so Postgres FORCE RLS enforces tenant
      # isolation (migration 020). Off by default; app-layer scoping is primary.
      - USE_RLS_ROLE=${USE_RLS_ROLE:-false}
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-change-in-production-2026}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - MAX_BODY_SIZE_MB=10
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      # Sage (NL→SQL) LLM. Defaults to a host-run Ollama; if Ollama isn't
      # running the call fast-fails and Sage falls back to the rule-based path.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      # Shared secret the worker uses to trigger scheduled risk scans.
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-foresia-internal-dev-token}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      # Lets the container reach an Ollama running on the host (Linux parity;
      # automatic on Docker Desktop for Mac/Windows).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - ./database:/app/database:ro
    networks:
      - sales_network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: sales_worker
    environment:
      - REDIS_URL=redis://redis:6379
      # Plain libpq URL (node-postgres) — distinct from the backend's asyncpg URL.
      - DATABASE_URL=postgres://${POSTGRES_USER:-salesuser}:${POSTGRES_PASSWORD:-salespass}@postgres:5432/${POSTGRES_DB:-salesdb}
      - WORKER_CONCURRENCY=8
      - WORKER_HEALTH_PORT=9100
      # Risk-scan scheduling: where to trigger the Python scan + the shared token.
      - BACKEND_URL=http://backend:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-foresia-internal-dev-token}
      - RISK_SCAN_EVERY_MS=${RISK_SCAN_EVERY_MS:-600000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - sales_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SSE_URL=http://localhost:8000/stream/sales
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - sales_network

volumes:
  postgres_data:
  redis_data:

networks:
  sales_network:
    driver: bridge